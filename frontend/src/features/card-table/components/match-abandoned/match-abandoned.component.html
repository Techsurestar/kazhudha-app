<div class="match-abandoned-viewport w-full max-w-md mx-auto min-h-[100dvh] h-[100dvh] flex flex-col justify-between items-center relative overflow-hidden select-none text-white p-5 sm:p-7">

  <!-- ==================================================== -->
  <!-- 1. FAINT FELT CARD SUIT WATERMARKS                   -->
  <!-- ==================================================== -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden z-0 select-none" aria-hidden="true">
    <!-- Spade watermark (Top-Left) -->
    <span class="absolute top-10 left-6 text-6xl sm:text-7xl font-serif text-black/[0.18] -rotate-12 blur-[0.4px]">♠</span>
    <!-- Heart watermark (Top-Right) -->
    <span class="absolute top-10 right-7 text-6xl sm:text-7xl font-serif text-black/[0.18] rotate-12 blur-[0.4px]">♥</span>
    <!-- Club watermark (Mid-Left) -->
    <span class="absolute top-[48%] left-3 text-5xl sm:text-6xl font-serif text-black/[0.14] rotate-6 blur-[0.5px]">♣</span>
    <!-- Diamond watermark (Mid-Right) -->
    <span class="absolute top-[48%] right-4 text-5xl sm:text-6xl font-serif text-black/[0.14] -rotate-6 blur-[0.5px]">♦</span>
  </div>

  <!-- ==================================================== -->
  <!-- 3. TOP SPACER / TOP AREA                             -->
  <!-- ==================================================== -->
  <div class="w-full h-2 sm:h-6 flex-shrink-0 relative z-10"></div>

  <!-- ==================================================== -->
  <!-- 4. CENTER CONTENT (GRAPHIC, TITLES, INFO CARD)       -->
  <!-- ==================================================== -->
  <div class="w-full flex flex-col items-center my-auto relative z-10 max-w-[360px]">

    <!-- Fanned Cards with Alert Warning Badge -->
    <div class="relative w-44 h-28 flex items-center justify-center mb-4 sm:mb-5">
      <!-- Global SVG Card Pattern Defs -->
      <svg class="absolute w-0 h-0 overflow-hidden" aria-hidden="true">
        <defs>
          <pattern id="card-back-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#881337" />
            <path d="M0 6 L6 0 L12 6 L6 12 Z" fill="#9f1239" />
            <path d="M6 6 L3 3 M6 6 L9 3 M6 6 L3 9 M6 6 L9 9" stroke="#fecdd3" stroke-width="0.5" opacity="0.3" />
            <circle cx="6" cy="6" r="1" fill="#fde047" opacity="0.6" />
          </pattern>
        </defs>
      </svg>

      <!-- Left Card (tilted -14deg) -->
      <div class="absolute left-6 top-1.5 w-[58px] h-[84px] sm:w-[62px] sm:h-[88px] -rotate-[14deg] rounded-[6px] p-[2.5px] bg-white shadow-[0_8px_16px_rgba(0,0,0,0.65)] flex-shrink-0 z-0">
        <div class="w-full h-full rounded-[4px] border border-white/40 overflow-hidden relative" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22><rect width=%2210%22 height=%2210%22 fill=%22%23881337%22/><path d=%22M0 5 L5 0 L10 5 L5 10 Z%22 fill=%22%239f1239%22 stroke=%22%23fecdd3%22 stroke-width=%220.5%22 opacity=%220.35%22/><circle cx=%225%22 cy=%225%22 r=%220.8%22 fill=%22%23fde047%22 opacity=%220.7%22/></svg>');">
          <div class="absolute inset-0.5 rounded-[3px] border border-white/20"></div>
        </div>
      </div>

      <!-- Right Card (tilted +14deg) -->
      <div class="absolute right-6 top-1.5 w-[58px] h-[84px] sm:w-[62px] sm:h-[88px] rotate-[14deg] rounded-[6px] p-[2.5px] bg-white shadow-[0_8px_16px_rgba(0,0,0,0.65)] flex-shrink-0 z-0">
        <div class="w-full h-full rounded-[4px] border border-white/40 overflow-hidden relative" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22><rect width=%2210%22 height=%2210%22 fill=%22%23881337%22/><path d=%22M0 5 L5 0 L10 5 L5 10 Z%22 fill=%22%239f1239%22 stroke=%22%23fecdd3%22 stroke-width=%220.5%22 opacity=%220.35%22/><circle cx=%225%22 cy=%225%22 r=%220.8%22 fill=%22%23fde047%22 opacity=%220.7%22/></svg>');">
          <div class="absolute inset-0.5 rounded-[3px] border border-white/20"></div>
        </div>
      </div>

      <!-- Center Card (upright, elevated) -->
      <div class="relative w-[60px] h-[88px] sm:w-[64px] sm:h-[92px] rounded-[6px] p-[2.5px] bg-white shadow-[0_12px_24px_rgba(0,0,0,0.75)] flex-shrink-0 z-10 -translate-y-1">
        <div class="w-full h-full rounded-[4px] border border-white/40 overflow-hidden relative" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22><rect width=%2210%22 height=%2210%22 fill=%22%23881337%22/><path d=%22M0 5 L5 0 L10 5 L5 10 Z%22 fill=%22%239f1239%22 stroke=%22%23fecdd3%22 stroke-width=%220.5%22 opacity=%220.35%22/><circle cx=%225%22 cy=%225%22 r=%220.8%22 fill=%22%23fde047%22 opacity=%220.7%22/></svg>');">
          <div class="absolute inset-0.5 rounded-[3px] border border-white/20"></div>
        </div>
      </div>

      <!-- Warning Alert Triangle Badge (Overlaid on bottom of center card) -->
      <div class="absolute z-20 top-12 left-1/2 -translate-x-1/2">
        <svg class="w-16 h-16 sm:w-[70px] sm:h-[70px] drop-shadow-[0_8px_16px_rgba(0,0,0,0.7)]" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="alertGrad" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#fb923c" />
              <stop offset="45%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#d97706" />
            </linearGradient>
          </defs>
          <!-- Rounded Equilateral Triangle with Soft Corner Arcs -->
          <path d="M28.2 10.4C29.9 7.4 34.1 7.4 35.8 10.4L56.4 46.4C58.1 49.3 56.0 53.0 52.6 53.0H11.4C8.0 53.0 5.9 49.3 7.6 46.4L28.2 10.4Z"
                fill="url(#alertGrad)"
                stroke="#fef08a"
                stroke-width="2.5"
                stroke-linejoin="round" />
          <!-- Exclamation Mark Bar -->
          <path d="M32 23V36.5" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
          <!-- Exclamation Mark Dot -->
          <circle cx="32" cy="44" r="2.6" fill="#ffffff" />
        </svg>
      </div>
    </div>

    <!-- Title Header -->
    <h1 class="text-xl sm:text-[30px] font-black text-white text-center mt-3 mb-1.5 drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]">
      {{ title() }}
    </h1>

    <!-- Subtitle Notice -->
    <p class="text-md sm:text-[15px] text-[#a1beae] font-normal text-center leading-relaxed whitespace-pre-line mb-6 sm:mb-7">
      {{ subtitle() }}
    </p>

    <!-- Translucent Info Card Box -->
    <div class="w-full rounded-2xl bg-[#042817]/70 border border-[#2dd4bf]/40 backdrop-blur-md p-4 sm:p-5 shadow-[0_8px_24px_rgba(0,0,0,0.4)] flex flex-col gap-3.5">

      <!-- Row 1: Points / XP Protection Notice -->
      <div class="flex items-start gap-3.5">
        <!-- Info Icon -->
        <svg class="w-6 h-6 text-white stroke-[1.8] flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" stroke-linecap="round" />
          <path d="M12 8h.01" stroke-linecap="round" />
        </svg>
        <span class="text-sm sm:text-[14px] text-white leading-snug font-normal">
          This match will not affect your points, XP, or rank.
        </span>
      </div>

      <!-- Thin Horizontal Divider -->
      <div class="w-full h-[1px] bg-[#2dd4bf]/20"></div>

      <!-- Row 2: Re-match Invitation Notice -->
      <div class="flex items-start gap-3.5">
        <!-- Users / Group Icon -->
        <svg class="w-6 h-6 text-white stroke-[1.8] flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" stroke-linecap="round" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round" />
        </svg>
        <span class="text-sm sm:text-[14px] text-white leading-snug font-normal">
          You can start a new match anytime and continue playing.
        </span>
      </div>

    </div>

  </div>

  <!-- ==================================================== -->
  <!-- 5. BOTTOM ACTIONS (PLAY AGAIN & BACK TO HOME)        -->
  <!-- ==================================================== -->
  <div class="w-full space-y-2 sm:space-y-2.5 pt-3 sm:pt-4 flex-shrink-0 max-w-[300px] mx-auto">

    <!-- Primary Action: Play Again -->
    <app-button variant="primary" routerLink="/game">
        <gameplay-icon [size]="20" />
        <span>Play Again</span>
    </app-button>

    <!-- Secondary Action: Back to Home -->
    <app-button variant="secondary" routerLink="/">
        <home-icon [size]="20" />
        <span>Back to Home</span>
    </app-button>

  </div>

</div>
