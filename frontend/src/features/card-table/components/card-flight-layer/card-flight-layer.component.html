<div class="relative w-full h-full pointer-events-none overflow-hidden select-none">

  @for (flight of activeFlights(); track flight.id) {
    <div
      class="absolute z-50 pointer-events-none drop-shadow-2xl"
      [class]="getFlightClass(flight)">

      @if (flight.isFaceDown) {
        <!-- Flying face-down card during distribution/dealing -->
        <div class="bot-card-back w-14 h-22 sm:w-14 sm:h-20 shadow-2xl rounded-md flex items-center justify-center">
          <div class="w-4 h-4 rounded-full border border-amber-300/60 bg-amber-400/30 flex items-center justify-center shadow-inner">
            <span class="text-[7px] text-amber-200 font-bold select-none">♣</span>
          </div>
        </div>
      } @else {
        <!-- Flying face-up card during trick play -->
        <app-card
          [rank]="flight.rank || ''"
          [suit]="flight.suit || 'SPADES'"
          cardClass="w-14 h-22 sm:w-14 sm:h-20 !p-1 rounded-md border border-slate-300 shadow-2xl bg-[#fdfcf7] pointer-events-none"
          cornerSize="text-[14px] sm:text-[10px] font-black"
          cornerIconSize="w-3 h-2.5 -mt-1 sm:w-2.5 sm:h-2.5"
          centerSize="w-6 h-6 mt-3 sm:w-4 sm:h-4">
        </app-card>
      }

    </div>
  }

</div>
