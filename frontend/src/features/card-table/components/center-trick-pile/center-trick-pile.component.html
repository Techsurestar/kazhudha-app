<div class="relative w-44 h-44 flex items-center justify-center pointer-events-none select-none">

  <!-- Vettu / Strike Flash Ambient Aura -->
  @if (isVettuFlashing()) {
    <div class="absolute inset-0 rounded-full bg-rose-500/25 blur-xl animate-vettu-ring pointer-events-none"></div>
  }

  <!-- Stacked 52-Card Deck (Shown when dealing cards on new game start) -->
  @if (deckCount() > 0) {
    <div class="relative w-14 h-22 sm:w-14 sm:h-20 flex items-center justify-center pointer-events-none transition-all duration-200">
      
      <!-- Depth shadow and bottom deck layers -->
      <div class="absolute inset-0 translate-x-1.5 translate-y-1.5 bot-card-back opacity-50 shadow-2xl rounded-md"></div>
      <div class="absolute inset-0 translate-x-1 translate-y-1 bot-card-back opacity-75 shadow-xl rounded-md"></div>
      <div class="absolute inset-0 translate-x-0.5 translate-y-0.5 bot-card-back opacity-90 shadow-lg rounded-md"></div>

      <!-- Top Deck Card -->
      <div class="relative w-full h-full bot-card-back shadow-2xl rounded-md flex flex-col items-center justify-center">
        <!-- Gold Medallion In Center of Card Back -->
        <div class="w-4 h-4 rounded-full border border-amber-300/60 bg-amber-400/30 flex items-center justify-center shadow-inner">
          <span class="text-[7px] text-amber-200 font-bold select-none">♣</span>
        </div>
      </div>

    </div>
  }

  <!-- Active Played Cards (Shown during active trick play) -->
  @if (deckCount() === 0) {
    @for (card of cards(); track card.playerId) {
      <div
        class="absolute"
        [class]="getPositionClass(card.position)">
        <app-card
          [rank]="card.rank"
          [suit]="card.suit"
          cardClass="w-14 h-22 sm:w-14 sm:h-20 !p-1 rounded-md border shadow-xl bg-[#fdfcf7] pointer-events-none"
          cornerSize="text-[14px] sm:text-[10px] font-black"
          cornerIconSize="w-3 h-2.5 -mt-1 sm:w-2.5 sm:h-2.5"
          centerSize="w-6 h-6 mt-3 sm:w-4 sm:h-4">
        </app-card>
      </div>
    }
  }

</div>
