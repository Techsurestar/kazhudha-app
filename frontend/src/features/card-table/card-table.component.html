<div class="w-full max-w-md mx-auto h-[100dvh] max-h-[100dvh] green-felt-arena flex flex-col justify-between overflow-hidden relative select-none font-sans text-white">

  <!-- ========================================== -->
  <!-- 1. TOP AD SLOT (50px - 60px ALLOCATION)   -->
  <!-- ========================================== -->
  <app-ad-banner
    [heightPx]="adSlotHeight"
    [isTestMode]="true"
    class="w-full flex-shrink-0 relative z-40 block">
  </app-ad-banner>

  <!-- ========================================== -->
  <!-- 2. MAIN CARD GAME ARENA                    -->
  <!-- ========================================== -->
  <main class="flex-1 w-full relative overflow-hidden">

    <!-- Central Kazhudha Club Felt Watermark -->
    <div class="absolute top-[42%] left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none select-none z-0 flex flex-col justify-end w-56 h-56 text-center"
         aria-hidden="true">

      <!-- Ornate "Kazhudha Club" Branding Watermark matching Home header typography -->
      <div class="flex flex-col items-center select-none mt-1 opacity-25">
        <span class="text-base sm:text-lg font-serif font-black tracking-tight gold-metallic-text leading-tight">
          Kazhudha Club
        </span>
        <!-- Ornate gold underline with centered diamond flourish -->
        <div class="flex items-center space-x-1.5 mt-0.5 opacity-90">
          <div class="h-[1px] w-8 bg-gradient-to-r from-transparent via-[#d4af37] to-[#d4af37]"></div>
          <div class="w-1.5 h-1.5 rotate-45 border border-[#d4af37] bg-[#f9e396] shadow-[0_0_4px_rgba(233,195,73,0.8)]"></div>
          <div class="h-[1px] w-8 bg-gradient-to-l from-transparent via-[#d4af37] to-[#d4af37]"></div>
        </div>
      </div>
    </div>

    <!-- ---------------------------------------- -->
    <!-- TOP OPPONENT (Leo)                       -->
    <!-- ---------------------------------------- -->
    <div class="absolute top-1 left-1/2 -translate-x-1/2 z-20">
      <app-opponent-seat
        [player]="topPlayer()"
        [chip]="getRankChip('bot2')">
      </app-opponent-seat>
    </div>

    <!-- ---------------------------------------- -->
    <!-- LEFT OPPONENT (Jenny)                   -->
    <!-- ---------------------------------------- -->
    <div class="absolute top-[42%] left-1.5 -translate-y-1/2 z-20">
      <app-opponent-seat
        [player]="leftPlayer()"
        [chip]="getRankChip('bot1')">
      </app-opponent-seat>
    </div>

    <!-- ---------------------------------------- -->
    <!-- RIGHT OPPONENT (Sofia)                   -->
    <!-- ---------------------------------------- -->
    <div class="absolute top-[42%] right-1.5 -translate-y-1/2 z-20">
      <app-opponent-seat
        [player]="rightPlayer()"
        [chip]="getRankChip('bot3')">
      </app-opponent-seat>
    </div>

    <!-- ---------------------------------------- -->
    <!-- CENTER PLAYED TRICK PILE                 -->
    <!-- ---------------------------------------- -->
    <div class="absolute top-[42%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none">
      <app-center-trick-pile
        [cards]="centerCards()"
        [deckCount]="remainingDeck()"
        [activeRoundSuit]="activeRoundSuit()"
        [isVettuFlashing]="isVettuFlashing()">
      </app-center-trick-pile>
    </div>

    <!-- ---------------------------------------- -->
    <!-- BOTTOM PLAYER (Human / You)              -->
    <!-- ---------------------------------------- -->
    <div class="absolute bottom-20 left-0 right-0 z-20 px-1">
      <app-human-hand
        [player]="humanPlayer()"
        [cards]="humanCards()"
        [disabled]="isDealing() || isReplaying() || currentTurnPlayerId() !== 'human'"
        [canSkip]="canSkip()"
        (cardPlay)="onCardPlayed($event)"
        (skipGame)="onSkipGame()"
        (timeUp)="onHumanTurnTimeout()">
      </app-human-hand>
    </div>

    <!-- ---------------------------------------- -->
    <!-- BOTTOM ACTION BAR                        -->
    <!-- ---------------------------------------- -->
    <div class="absolute bottom-2.5 left-1 right-1 z-30">
      <app-action-bar
        [badgeText]="actionBadgeText()">
      </app-action-bar>
    </div>

    <!-- ---------------------------------------- -->
    <!-- CARD FLIGHT ANIMATION OVERLAY LAYER      -->
    <!-- ---------------------------------------- -->
    <app-card-flight-layer
      class="absolute inset-0 pointer-events-none z-50 overflow-hidden"
      (flightComplete)="onFlightComplete($event)">
    </app-card-flight-layer>

  </main>

  <!-- ========================================== -->
  <!-- 3. GAME RESULT MODAL OVERLAY               -->
  <!-- ========================================== -->
  @if (showGameResultModal()) {
    <app-game-result
      [players]="playersList()"
      [hands]="hands()"
      [tournamentOver]="tournamentOver()"
      [kazhudhaPlayerId]="kazhudhaPlayerId()"
      [isGuest]="isGuest()"
      (restart)="onRestartGame()">
    </app-game-result>
  }

</div>
