<div class="felt-texture h-[100dvh] max-h-[100dvh] text-slate-100 flex flex-col justify-between selection:bg-[#e9c349]/30 overflow-hidden relative">

  <!-- Outer Centering Container (Mobile App Frame on Desktop, Full Viewport on Mobile) -->
  <div class="w-full max-w-md mx-auto h-full flex flex-col justify-between relative z-10 overflow-hidden">

    <!-- Top Header Bar -->
    <header class="flex items-center justify-between px-4 pt-3 pb-1 flex-shrink-0">
      <div class="flex flex-col items-start cursor-default select-none">
        <h1 class="text-base sm:text-lg font-serif font-black tracking-tight gold-metallic-text leading-tight">
          Kazhudha Club
        </h1>
        <!-- Ornate gold underline with centered diamond flourish -->
        <div class="flex items-center space-x-1.5 mt-0.5 opacity-90">
          <div class="h-[1px] w-8 bg-gradient-to-r from-transparent via-[#d4af37] to-[#d4af37]"></div>
          <div class="w-1.5 h-1.5 rotate-45 border border-[#d4af37] bg-[#f9e396] shadow-[0_0_4px_rgba(233,195,73,0.8)]"></div>
          <div class="h-[1px] w-8 bg-gradient-to-l from-transparent via-[#d4af37] to-[#d4af37]"></div>
        </div>
      </div>
    </header>

    <!-- Home Profile Meta Widget -->
    <section class="px-4 py-1 flex-shrink-0" aria-label="Profile summary">
      <app-home-profile-meta
        [clickable]="true"
        [playerName]="authService.displayName()"
        [avatarUrl]="authService.avatarUrl()"
        [badgeText]="authService.isAuthenticated() ? 'Online' : 'Guest Mode'"
        [subtitle]="authService.isAuthenticated() ? 'Logged in via Google' : 'You\'re playing as a guest'"
        (profileClick)="openProfile()" />
    </section>

    <!-- Main Content Area (Vertically Centered in Screen) -->
    <main class="flex-1 flex flex-col items-center justify-center text-center px-4 my-auto min-h-0 py-2">
      <!-- App Logo with Floating Animation & Glow -->
      <div class="relative py-1 sm:py-2 flex items-center justify-center flex-shrink-0 select-none">
        <img src="assets/app-logo.png"
             alt="Kazhudha Club Logo"
             class="w-32 h-32 sm:w-36 sm:h-36 object-contain drop-shadow-[0_0_24px_rgba(233,195,73,0.45)] select-none animate-float" />
      </div>

      <!-- Main Heading & Tagline -->
      <div class="space-y-1.5 sm:space-y-2 flex-shrink-0">
        <h2 class="text-2xl sm:text-3xl font-serif font-black text-[#e9c349] gold-text-glow leading-tight tracking-tight">
          Welcome to <br/> Kazhudha Club!
        </h2>
        <p class="text-xs sm:text-[13px] text-slate-200 font-medium leading-relaxed max-w-[280px] sm:max-w-[320px] mx-auto drop-shadow-md">
          Ready to pass the blame and skip the shame!<br/>
          <span class="text-[#f5d475] font-semibold">Ditch the card. Claim the crown.</span>
        </p>
      </div>

      <!-- Action Buttons Container -->
      <div class="w-full space-y-2.5 pt-5 sm:pt-6 flex-shrink-0 max-w-[300px] mx-auto">
        @if (signInError()) {
          <div class="text-xs text-rose-300 bg-rose-950/60 border border-rose-500/40 rounded-xl px-3 py-2 text-center animate-fadeIn">
            {{ signInError() }}
          </div>
        }

        @if (authService.isAuthenticated()) {
          <!-- Play Game Button -->
          <button routerLink="/game"
                  class="gold-gradient-btn w-full text-slate-950 font-black text-md sm:text-base py-3 sm:py-3.5 rounded-xl shadow-xl flex items-center justify-center space-x-2 tracking-wider transition-all transform active:scale-[0.98] cursor-pointer focus:outline-none">
            <span>Play Game</span>
            <chevrons-right-icon [size]="20" />
          </button>

          <!-- Sign Out Button -->
          <button type="button"
                  (click)="signOut()"
                  class="w-full bg-white/[0.06] hover:bg-white/[0.1] text-slate-300 hover:text-white border border-white/10 font-bold text-xs py-2.5 rounded-xl transition-all cursor-pointer">
            <span>Sign Out</span>
          </button>
        } @else {
          <!-- Play as Guest Button -->
          <button routerLink="/game"
                  class="gold-gradient-btn w-full text-slate-950 font-black text-md sm:text-base py-3 sm:py-3.5 rounded-xl shadow-xl flex items-center justify-center space-x-2 tracking-wider transition-all transform active:scale-[0.98] cursor-pointer focus:outline-none">
            <span>Play as Guest</span>
            <chevrons-right-icon [size]="20" />
          </button>

          <!-- Continue with Google Button -->
          <button type="button"
                  (click)="continueWithGoogle()"
                  [disabled]="isSigningIn()"
                  class="gold-gradient-btn w-full text-slate-950 font-black text-md sm:text-base py-3 sm:py-3.5 rounded-xl shadow-xl flex items-center justify-center space-x-2 tracking-wider transition-all transform active:scale-[0.98] cursor-pointer focus:outline-none disabled:opacity-60 disabled:cursor-not-allowed">
            @if (isSigningIn()) {
              <div class="w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
              <span>Connecting to Google...</span>
            } @else {
              <svg viewBox="0 0 48 48" width="28" height="28">
                <!-- White Circular Background -->
                <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
                <!-- Google "G" Logo -->
                <g transform="matrix(0.55 0 0 0.55 10.8 10.8)">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </g>
              </svg>
              <span>Continue with Google</span>
            }
          </button>
        }
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <app-bottom-nav />

  </div>
</div>
