<nav class="bottom-nav-bar w-full pt-2 pb-2.5 sm:pb-3 px-3 flex-shrink-0 z-20" aria-label="Bottom Navigation">
  <div class="grid grid-cols-4 items-center text-center">

    <!-- 1. Home -->
    <button type="button"
            (click)="navigate('home')"
            class="flex flex-col items-center justify-center space-y-1 py-1 cursor-pointer transition-colors focus:outline-none"
            [ngClass]="isTabActive('home') ? 'text-[#f5c518]' : 'text-slate-400 hover:text-slate-200'"
            aria-label="Home Tab">
      <home-icon [size]="20" />
      <span class="text-[10.5px] font-bold tracking-tight">Home</span>
      <div class="h-[2px] w-6 rounded-full transition-all duration-300 mt-0.5"
           [ngClass]="isTabActive('home') ? 'bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 shadow-[0_0_8px_rgba(245,197,24,0.95)] opacity-100' : 'opacity-0'"></div>
    </button>

    <!-- 2. Play -->
    <button type="button"
            (click)="navigate('play')"
            class="flex flex-col items-center justify-center space-y-1 py-1 cursor-pointer transition-colors focus:outline-none"
            [ngClass]="isTabActive('play') ? 'text-[#f5c518]' : 'text-slate-400 hover:text-slate-200'"
            aria-label="Play Tab">
      <gamepad-icon [size]="20" />
      <span class="text-[10.5px] font-medium tracking-tight">Play</span>
      <div class="h-[2px] w-6 rounded-full transition-all duration-300 mt-0.5"
           [ngClass]="isTabActive('play') ? 'bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 shadow-[0_0_8px_rgba(245,197,24,0.95)] opacity-100' : 'opacity-0'"></div>
    </button>

    <!-- 3. Leaderboard -->
    <button type="button"
            (click)="navigate('leaderboard')"
            class="flex flex-col items-center justify-center space-y-1 py-1 cursor-pointer transition-colors focus:outline-none"
            [ngClass]="isTabActive('leaderboard') ? 'text-[#f5c518]' : 'text-slate-400 hover:text-slate-200'"
            aria-label="Leaderboard Tab">
      <leaderboard-icon [size]="20" />
      <span class="text-[10.5px] font-bold tracking-tight">Leaderboard</span>
      <div class="h-[2px] w-6 rounded-full transition-all duration-300 mt-0.5"
           [ngClass]="isTabActive('leaderboard') ? 'bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 shadow-[0_0_8px_rgba(245,197,24,0.95)] opacity-100' : 'opacity-0'"></div>
    </button>

    <!-- 4. Profile -->
    <button type="button"
            (click)="navigate('profile')"
            class="flex flex-col items-center justify-center space-y-1 py-1 cursor-pointer transition-colors focus:outline-none"
            [ngClass]="isTabActive('profile') ? 'text-[#f5c518]' : 'text-slate-400 hover:text-slate-200'"
            aria-label="Profile Tab">
      <user-icon [size]="20" />
      <span class="text-[10.5px] font-medium tracking-tight">Profile</span>
      <div class="h-[2px] w-6 rounded-full transition-all duration-300 mt-0.5"
           [ngClass]="isTabActive('profile') ? 'bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 shadow-[0_0_8px_rgba(245,197,24,0.95)] opacity-100' : 'opacity-0'"></div>
    </button>

  </div>
</nav>
