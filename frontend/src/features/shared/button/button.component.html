<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  (click)="handleClick($event)">
  @if (loading()) {
    <div class="w-5 h-5 border-2 border-current border-t-transparent rounded-full animate-spin flex-shrink-0" aria-label="Loading"></div>
  }
  <ng-content />
</button>
